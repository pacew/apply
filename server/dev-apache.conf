# Development only: run the program server under the 18411 Apache.
#
# Install once on ai.local, outside the repository:
#
#   sudo cp server/dev-apache.conf /etc/apache2/conf-available/neffa-program-dev.conf
#   sudo a2enconf neffa-program-dev
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# This file survives `psite install`, which rewrites TMP.conf and the vhost.
# The cgi module must also stay enabled (`sudo a2enmod cgi`).

<Directory /home/pace/apply>
  Options +ExecCGI
  AddHandler cgi-script .py
  AcceptPathInfo On
  SetEnv PROGRAM_HOME /home/pace/program-web
</Directory>

<Directory /home/pace/apply/server>
  Require all denied
</Directory>
